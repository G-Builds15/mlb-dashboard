name: Update MLB Dashboard

on:
  schedule:
    - cron: '0 14 * * *'   # 10:00 AM ET
    - cron: '0 21 * * *'   # 5:00 PM ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # ── Step 1: Fetch raw data via curl ──────────────────────────────

      - name: Fetch MLB starters (MLB Stats API)
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "Fetching starters for $DATE"
          curl -sf \
            "https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${DATE}&hydrate=probablePitcher(note),team,linescore&language=en" \
            -o starters_raw.json
          echo "Starters response size: $(wc -c < starters_raw.json) bytes"
          # Verify we got game data
          python3 -c "
          import json, sys
          d = json.load(open('starters_raw.json'))
          games = [g for dt in d.get('dates',[]) for g in dt.get('games',[])]
          print(f'Games found: {len(games)}')
          for g in games:
              away = g['teams']['away']['team']['name']
              home = g['teams']['home']['team']['name']
              ap   = g['teams']['away'].get('probablePitcher',{})
              hp   = g['teams']['home'].get('probablePitcher',{})
              print(f'  {away} @ {home}: {ap.get(\"fullName\",\"TBD\")} (ID:{ap.get(\"id\",\"?\")}) vs {hp.get(\"fullName\",\"TBD\")} (ID:{hp.get(\"id\",\"?\")})')
          if not games:
              print('WARNING: No games found')
              sys.exit(0)
          "

      - name: Fetch game odds (The Odds API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "Fetching odds for $DATE"
          curl -sf \
            "https://api.the-odds-api.com/v4/sports/baseball_mlb/odds/?apiKey=${ODDS_API_KEY}&regions=us&markets=h2h,spreads,totals&oddsFormat=american&dateFormat=iso" \
            -o odds_raw.json
          echo "Odds response size: $(wc -c < odds_raw.json) bytes"
          python3 -c "
          import json
          d = json.load(open('odds_raw.json'))
          today = '$(date -u +%Y-%m-%d)'
          games = [g for g in d if g.get('commence_time','').startswith(today)]
          print(f'Games with odds today: {len(games)}')
          for g in games:
              print(f'  {g[\"away_team\"]} @ {g[\"home_team\"]} — {g[\"commence_time\"][:16]}')
          "

      - name: Fetch pitcher props (The Odds API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          # Get event IDs for today's games first
          curl -sf \
            "https://api.the-odds-api.com/v4/sports/baseball_mlb/events?apiKey=${ODDS_API_KEY}&dateFormat=iso" \
            -o events_raw.json
          echo "Events response size: $(wc -c < events_raw.json) bytes"

          # Fetch props for each event
          python3 - << 'PYEOF'
          import json, subprocess, os, time

          api_key = os.environ.get("ODDS_API_KEY","")
          today   = subprocess.check_output(["date","-u","+%Y-%m-%d"]).decode().strip()

          events  = json.load(open("events_raw.json"))
          today_e = [e for e in events if e.get("commence_time","").startswith(today)]
          print(f"Events today: {len(today_e)}")

          all_props = {}
          markets   = "pitcher_strikeouts,pitcher_earned_runs,pitcher_walks,pitcher_outs,pitcher_hits_allowed"

          for ev in today_e:
              eid  = ev["id"]
              away = ev["away_team"]
              home = ev["home_team"]
              url  = (f"https://api.the-odds-api.com/v4/sports/baseball_mlb/events/{eid}/odds"
                      f"?apiKey={api_key}&regions=us&markets={markets}&oddsFormat=american")
              try:
                  result = subprocess.run(
                      ["curl","-sf", url],
                      capture_output=True, text=True, timeout=15
                  )
                  if result.returncode == 0 and result.stdout.strip():
                      data = json.loads(result.stdout)
                      all_props[eid] = {
                          "away": away, "home": home,
                          "data": data,
                      }
                      bm_count = len(data.get("bookmakers",[]))
                      print(f"  ✓ {away} @ {home} — {bm_count} bookmakers")
                  else:
                      print(f"  ~ {away} @ {home} — no prop data")
              except Exception as ex:
                  print(f"  ✗ {away} @ {home} — {ex}")
              time.sleep(0.3)  # respect rate limit

          json.dump(all_props, open("props_raw.json","w"))
          print(f"Props saved: {len(all_props)} games")
          PYEOF

      - name: Fetch pitcher season stats (MLB Stats API)
        run: |
          python3 - << 'PYEOF'
          import json, subprocess, time
          from datetime import datetime, timedelta

          today = datetime.now()

          starters_data = json.load(open("starters_raw.json"))
          games = [g for dt in starters_data.get("dates",[])
                     for g in dt.get("games",[])]

          # Collect all pitcher IDs
          pids = {}
          for g in games:
              for side in ["away","home"]:
                  prob = g["teams"][side].get("probablePitcher",{})
                  pid  = prob.get("id")
                  name = prob.get("fullName","TBD")
                  if pid and name and name != "TBD":
                      pids[pid] = name

          print(f"Fetching stats for {len(pids)} pitchers...")
          season = today.year
          stats_out = {}

          for pid, name in pids.items():
              # Season stats
              url_s = f"https://statsapi.mlb.com/api/v1/people/{pid}/stats?stats=season&group=pitching&season={season}"
              r = subprocess.run(["curl","-sf", url_s],
                                 capture_output=True, text=True, timeout=10)
              s_data = {}
              if r.returncode == 0 and r.stdout.strip():
                  try:
                      d      = json.loads(r.stdout)
                      splits = d.get("stats",[{}])[0].get("splits",[])
                      if splits:
                          s = splits[0]["stat"]
                          ip = float(s.get("inningsPitched",0) or 0)
                          gs = int(s.get("gamesStarted",1) or 1)
                          k  = int(s.get("strikeOuts",0) or 0)
                          bf = int(s.get("battersFaced",0) or 0)
                          s_data = {
                              "era":   float(s.get("era",4.20) or 4.20),
                              "whip":  float(s.get("whip",1.30) or 1.30),
                              "k9":    float(s.get("strikeoutsPer9Inn",8.0) or 8.0),
                              "bb9":   float(s.get("walksPer9Inn",3.0) or 3.0),
                              "h9":    float(s.get("hitsPer9Inn",9.0) or 9.0),
                              "ip":    ip,
                              "avgIP": round(ip/max(gs,1),1),
                              "gs":    gs,
                              "kPct":  round(k/max(bf,1)*100,1) if bf>20 else None,
                              "_source":"mlb_stats_api",
                          }
                  except: pass

              # Recent splits — L5 (35 days) and L3 (21 days)
              splits_out = {}
              for label, days in [("l5",35),("l3",21)]:
                  start = (today - timedelta(days=days)).strftime("%Y-%m-%d")
                  end   = today.strftime("%Y-%m-%d")
                  url_r = (f"https://statsapi.mlb.com/api/v1/people/{pid}/stats"
                           f"?stats=byDateRange&group=pitching"
                           f"&startDate={start}&endDate={end}&season={season}")
                  r2 = subprocess.run(["curl","-sf", url_r],
                                      capture_output=True, text=True, timeout=10)
                  if r2.returncode == 0 and r2.stdout.strip():
                      try:
                          d2 = json.loads(r2.stdout)
                          sp = d2.get("stats",[{}])[0].get("splits",[])
                          if sp:
                              st = sp[0]["stat"]
                              k2  = int(st.get("strikeOuts",0) or 0)
                              bf2 = int(st.get("battersFaced",0) or 0)
                              bb9 = float(st.get("walksPer9Inn",0) or 0)
                              splits_out[f"{label}ERA"]  = float(st.get("era",0) or 0) or None
                              splits_out[f"{label}KPct"] = round(k2/max(bf2,1)*100,1) if bf2>10 else None
                              splits_out[f"{label}BB9"]  = bb9 or None
                      except: pass

              stats_out[pid] = {
                  "name":   name,
                  "season": s_data,
                  "splits": splits_out,
              }

              status = "✓" if s_data else "✗"
              print(f"  {status} {name} (ID:{pid}): ERA {s_data.get('era','?')} "
                    f"K/9 {s_data.get('k9','?')} BB/9 {s_data.get('bb9','?')}")
              time.sleep(0.2)

          json.dump(stats_out, open("pitcher_stats_raw.json","w"))
          print(f"\nPitcher stats saved: {len(stats_out)} pitchers")
          PYEOF

      - name: Fetch team offense + bullpen stats (MLB Stats API)
        run: |
          python3 - << 'PYEOF'
          import json, subprocess, time
          from datetime import datetime, timedelta

          today  = datetime.now()
          season = today.year
          end    = today.strftime("%Y-%m-%d")
          start_l5  = (today - timedelta(days=8)).strftime("%Y-%m-%d")
          start_bp  = (today - timedelta(days=14)).strftime("%Y-%m-%d")

          starters_data = json.load(open("starters_raw.json"))
          games = [g for dt in starters_data.get("dates",[])
                     for g in dt.get("games",[])]

          # Collect unique team IDs
          team_ids = {}
          for g in games:
              for side in ["away","home"]:
                  tid  = g["teams"][side]["team"].get("id")
                  name = g["teams"][side]["team"].get("name")
                  if tid: team_ids[tid] = name

          print(f"Fetching team stats for {len(team_ids)} teams...")
          team_stats_out = {}

          for tid, name in team_ids.items():
              stats = {"name": name}

              # Season offense
              url_s = (f"https://statsapi.mlb.com/api/v1/teams/{tid}/stats"
                       f"?stats=season&group=hitting&season={season}")
              r = subprocess.run(["curl","-sf", url_s],
                                 capture_output=True, text=True, timeout=10)
              if r.returncode == 0 and r.stdout.strip():
                  try:
                      sp = json.loads(r.stdout).get("stats",[{}])[0].get("splits",[])
                      if sp:
                          s = sp[0]["stat"]
                          gp = int(s.get("gamesPlayed",1) or 1)
                          ru = int(s.get("runs",0) or 0)
                          pa = int(s.get("plateAppearances",1) or 1)
                          stats.update({
                              "rPerG":  round(ru/max(gp,1),2),
                              "avg":    s.get("avg",".250"),
                              "obp":    s.get("obp",".320"),
                              "ops":    s.get("ops",".720"),
                              "kPct":   round(int(s.get("strikeOuts",0) or 0)/max(pa,1)*100,1),
                              "bbPct":  round(int(s.get("baseOnBalls",0) or 0)/max(pa,1)*100,1),
                          })
                  except: pass

              # L5 R/G
              url_l5 = (f"https://statsapi.mlb.com/api/v1/teams/{tid}/stats"
                        f"?stats=byDateRange&group=hitting"
                        f"&startDate={start_l5}&endDate={end}&season={season}")
              r2 = subprocess.run(["curl","-sf", url_l5],
                                  capture_output=True, text=True, timeout=10)
              if r2.returncode == 0 and r2.stdout.strip():
                  try:
                      sp = json.loads(r2.stdout).get("stats",[{}])[0].get("splits",[])
                      if sp:
                          s2 = sp[0]["stat"]
                          gp = int(s2.get("gamesPlayed",0) or 0)
                          ru = int(s2.get("runs",0) or 0)
                          if gp >= 3:
                              stats["rPerG_L5"] = round(ru/gp,2)
                  except: pass

              # Bullpen ERA L14
              url_bp = (f"https://statsapi.mlb.com/api/v1/teams/{tid}/stats"
                        f"?stats=byDateRange&group=pitching"
                        f"&startDate={start_bp}&endDate={end}&season={season}")
              r3 = subprocess.run(["curl","-sf", url_bp],
                                  capture_output=True, text=True, timeout=10)
              if r3.returncode == 0 and r3.stdout.strip():
                  try:
                      sp = json.loads(r3.stdout).get("stats",[{}])[0].get("splits",[])
                      if sp:
                          era = sp[0]["stat"].get("era")
                          if era: stats["bullpenERA_L14"] = float(era)
                  except: pass

              stats["_source"] = "mlb_stats_api"
              team_stats_out[tid] = stats
              print(f"  ✓ {name}: R/G {stats.get('rPerG','?')} "
                    f"L5 {stats.get('rPerG_L5','?')} "
                    f"BP ERA {stats.get('bullpenERA_L14','?')}")
              time.sleep(0.2)

          json.dump(team_stats_out, open("team_stats_raw.json","w"))
          print(f"\nTeam stats saved: {len(team_stats_out)} teams")
          PYEOF

      # ── Step 2: Grade and build ───────────────────────────────────────

      - name: Assemble games_data.js
        run: |
          python3 odds_fetcher.py
          echo "--- games_data.js preview ---"
          head -40 games_data.js

      - name: Build slate and grade props
        run: |
          python3 slate_builder.py
          echo "--- slate_data.js preview ---"
          head -30 slate_data.js

      - name: Build dashboard
        run: |
          python3 build.py

      # ── Step 3: Commit ────────────────────────────────────────────────

      - name: Commit updated files
        run: |
          git config user.email "mlb-bot@dashboard"
          git config user.name "MLB Dashboard Bot"
          git add games_data.js slate_data.js mlb_dashboard.html
          git diff --staged --quiet || \
            git commit -m "Auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
