name: Update MLB Dashboard

on:
  schedule:
    - cron: '0 14 * * *'   # 10:00 AM ET
    - cron: '0 21 * * *'   # 5:00 PM ET
  workflow_dispatch:

permissions:
  contents: write

env:
  WORK_DIR: ${{ github.workspace }}

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Confirm working directory
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "PWD: $(pwd)"
          ls -la

      # ── Step 1: Fetch MLB starters ────────────────────────────────────

      - name: Fetch starters (MLB Stats API)
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "Fetching starters for $DATE"
          curl -sf \
            "https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${DATE}&hydrate=probablePitcher(note),team,linescore&language=en" \
            > "$GITHUB_WORKSPACE/starters_raw.json"
          echo "Written to: $GITHUB_WORKSPACE/starters_raw.json"
          echo "Size: $(wc -c < $GITHUB_WORKSPACE/starters_raw.json) bytes"
          python3 -c "
          import json, sys
          d = json.load(open('$GITHUB_WORKSPACE/starters_raw.json'))
          games = [g for dt in d.get('dates',[]) for g in dt.get('games',[])]
          print(f'Games found: {len(games)}')
          for g in games:
              ap = g['teams']['away'].get('probablePitcher',{}) or {}
              hp = g['teams']['home'].get('probablePitcher',{}) or {}
              print(f\"  {g['teams']['away']['team']['name']} @ {g['teams']['home']['team']['name']}: {ap.get('fullName','TBD')} (ID:{ap.get('id','?')}) vs {hp.get('fullName','TBD')} (ID:{hp.get('id','?')})\")
          "

      # ── Step 2: Fetch game odds ───────────────────────────────────────

      - name: Fetch odds (The Odds API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          curl -sf \
            "https://api.the-odds-api.com/v4/sports/baseball_mlb/odds/?apiKey=${ODDS_API_KEY}&regions=us&markets=h2h,spreads,totals&oddsFormat=american&dateFormat=iso" \
            > "$GITHUB_WORKSPACE/odds_raw.json"
          echo "Size: $(wc -c < $GITHUB_WORKSPACE/odds_raw.json) bytes"
          python3 -c "
          import json
          d = json.load(open('$GITHUB_WORKSPACE/odds_raw.json'))
          from datetime import datetime, timezone
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          games = [g for g in d if g.get('commence_time','').startswith(today)]
          print(f'Games with odds today: {len(games)}')
          for g in games:
              print(f\"  {g['away_team']} @ {g['home_team']} — {g['commence_time'][:16]}\")
          "

      # ── Step 3: Fetch pitcher props ───────────────────────────────────

      - name: Fetch events + props (The Odds API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          curl -sf \
            "https://api.the-odds-api.com/v4/sports/baseball_mlb/events?apiKey=${ODDS_API_KEY}&dateFormat=iso" \
            > "$GITHUB_WORKSPACE/events_raw.json"

          python3 << 'PYEOF'
import json, subprocess, os, time
from datetime import datetime, timezone

ws      = os.environ["GITHUB_WORKSPACE"]
api_key = os.environ["ODDS_API_KEY"]
today   = datetime.now(timezone.utc).strftime("%Y-%m-%d")
events  = json.load(open(f"{ws}/events_raw.json"))
today_e = [e for e in events if e.get("commence_time","").startswith(today)]
print(f"Events today: {len(today_e)}")

markets = "pitcher_strikeouts,pitcher_earned_runs,pitcher_walks,pitcher_outs,pitcher_hits_allowed"
all_props = {}

for ev in today_e:
    eid = ev["id"]
    url = (f"https://api.the-odds-api.com/v4/sports/baseball_mlb/events/{eid}/odds"
           f"?apiKey={api_key}&regions=us&markets={markets}&oddsFormat=american")
    r = subprocess.run(["curl","-sf",url], capture_output=True, text=True, timeout=15)
    if r.returncode == 0 and r.stdout.strip():
        try:
            data = json.loads(r.stdout)
            all_props[eid] = {"away":ev["away_team"],"home":ev["home_team"],"data":data}
            print(f"  ✓ {ev['away_team']} @ {ev['home_team']}")
        except:
            print(f"  ✗ {ev['away_team']} @ {ev['home_team']} — parse error")
    else:
        print(f"  ~ {ev['away_team']} @ {ev['home_team']} — no data")
    time.sleep(0.3)

out = f"{ws}/props_raw.json"
json.dump(all_props, open(out,"w"))
print(f"Props saved to {out}: {len(all_props)} games")
PYEOF

      # ── Step 4: Fetch pitcher season + split stats ────────────────────

      - name: Fetch pitcher stats (MLB Stats API)
        run: |
          python3 << 'PYEOF'
import json, subprocess, os, time
from datetime import datetime, timedelta

ws      = os.environ["GITHUB_WORKSPACE"]
today   = datetime.now()
season  = today.year
end     = today.strftime("%Y-%m-%d")

starters_data = json.load(open(f"{ws}/starters_raw.json"))
games = [g for dt in starters_data.get("dates",[]) for g in dt.get("games",[])]

# Collect pitcher IDs
pids = {}
for g in games:
    for side in ["away","home"]:
        prob = g["teams"][side].get("probablePitcher") or {}
        pid  = prob.get("id")
        name = prob.get("fullName","TBD")
        if pid and name not in ("TBD",""):
            pids[pid] = name

print(f"Fetching stats for {len(pids)} pitchers...")
stats_out = {}

for pid, name in pids.items():
    # Season stats
    url_s = f"https://statsapi.mlb.com/api/v1/people/{pid}/stats?stats=season&group=pitching&season={season}"
    r = subprocess.run(["curl","-sf",url_s], capture_output=True, text=True, timeout=10)
    s_data = {}
    if r.returncode == 0 and r.stdout.strip():
        try:
            splits = json.loads(r.stdout).get("stats",[{}])[0].get("splits",[])
            if splits:
                s  = splits[0]["stat"]
                ip = float(s.get("inningsPitched",0) or 0)
                gs = int(s.get("gamesStarted",1) or 1)
                k  = int(s.get("strikeOuts",0) or 0)
                bf = int(s.get("battersFaced",0) or 0)
                s_data = {
                    "era":     float(s.get("era",4.20) or 4.20),
                    "whip":    float(s.get("whip",1.30) or 1.30),
                    "k9":      float(s.get("strikeoutsPer9Inn",8.0) or 8.0),
                    "bb9":     float(s.get("walksPer9Inn",3.0) or 3.0),
                    "h9":      float(s.get("hitsPer9Inn",9.0) or 9.0),
                    "ip":      ip,
                    "avgIP":   round(ip/max(gs,1),1),
                    "gs":      gs,
                    "kPct":    round(k/max(bf,1)*100,1) if bf > 20 else None,
                    "_source": "mlb_stats_api",
                }
        except: pass

    # Recent splits
    splits_out = {}
    for label, days in [("l5",35),("l3",21)]:
        start = (today - timedelta(days=days)).strftime("%Y-%m-%d")
        url_r = (f"https://statsapi.mlb.com/api/v1/people/{pid}/stats"
                 f"?stats=byDateRange&group=pitching&startDate={start}&endDate={end}&season={season}")
        r2 = subprocess.run(["curl","-sf",url_r], capture_output=True, text=True, timeout=10)
        if r2.returncode == 0 and r2.stdout.strip():
            try:
                sp = json.loads(r2.stdout).get("stats",[{}])[0].get("splits",[])
                if sp:
                    st = sp[0]["stat"]
                    k2 = int(st.get("strikeOuts",0) or 0)
                    bf2= int(st.get("battersFaced",0) or 0)
                    splits_out[f"{label}ERA"]  = float(st.get("era",0) or 0) or None
                    splits_out[f"{label}KPct"] = round(k2/max(bf2,1)*100,1) if bf2>10 else None
                    splits_out[f"{label}BB9"]  = float(st.get("walksPer9Inn",0) or 0) or None
            except: pass

    stats_out[str(pid)] = {"name":name,"season":s_data,"splits":splits_out}
    ok = "✓" if s_data else "✗"
    print(f"  {ok} {name} (ID:{pid}): ERA {s_data.get('era','?')} K/9 {s_data.get('k9','?')} BB/9 {s_data.get('bb9','?')}")
    time.sleep(0.2)

out = f"{ws}/pitcher_stats_raw.json"
json.dump(stats_out, open(out,"w"))
print(f"Saved: {out} ({len(stats_out)} pitchers)")
PYEOF

      # ── Step 5: Fetch team stats ──────────────────────────────────────

      - name: Fetch team stats (MLB Stats API)
        run: |
          python3 << 'PYEOF'
import json, subprocess, os, time
from datetime import datetime, timedelta

ws     = os.environ["GITHUB_WORKSPACE"]
today  = datetime.now()
season = today.year
end    = today.strftime("%Y-%m-%d")
start_l5 = (today - timedelta(days=8)).strftime("%Y-%m-%d")
start_bp = (today - timedelta(days=14)).strftime("%Y-%m-%d")

starters_data = json.load(open(f"{ws}/starters_raw.json"))
games = [g for dt in starters_data.get("dates",[]) for g in dt.get("games",[])]

team_ids = {}
for g in games:
    for side in ["away","home"]:
        tid  = g["teams"][side]["team"].get("id")
        name = g["teams"][side]["team"].get("name","")
        if tid: team_ids[str(tid)] = name

print(f"Fetching team stats for {len(team_ids)} teams...")
out_data = {}

for tid, name in team_ids.items():
    stats = {"name":name,"_source":"mlb_stats_api"}

    # Season offense
    r = subprocess.run(
        ["curl","-sf",f"https://statsapi.mlb.com/api/v1/teams/{tid}/stats?stats=season&group=hitting&season={season}"],
        capture_output=True, text=True, timeout=10)
    if r.returncode == 0 and r.stdout.strip():
        try:
            sp = json.loads(r.stdout).get("stats",[{}])[0].get("splits",[])
            if sp:
                s  = sp[0]["stat"]
                gp = int(s.get("gamesPlayed",1) or 1)
                ru = int(s.get("runs",0) or 0)
                pa = int(s.get("plateAppearances",1) or 1)
                stats.update({
                    "rPerG":  round(ru/max(gp,1),2),
                    "avg":    s.get("avg",".250"),
                    "ops":    s.get("ops",".720"),
                    "kPct":   round(int(s.get("strikeOuts",0) or 0)/max(pa,1)*100,1),
                    "bbPct":  round(int(s.get("baseOnBalls",0) or 0)/max(pa,1)*100,1),
                })
        except: pass

    # L5 R/G
    r2 = subprocess.run(
        ["curl","-sf",f"https://statsapi.mlb.com/api/v1/teams/{tid}/stats?stats=byDateRange&group=hitting&startDate={start_l5}&endDate={end}&season={season}"],
        capture_output=True, text=True, timeout=10)
    if r2.returncode == 0 and r2.stdout.strip():
        try:
            sp = json.loads(r2.stdout).get("stats",[{}])[0].get("splits",[])
            if sp:
                s2 = sp[0]["stat"]
                gp = int(s2.get("gamesPlayed",0) or 0)
                ru = int(s2.get("runs",0) or 0)
                if gp >= 3: stats["rPerG_L5"] = round(ru/gp,2)
        except: pass

    # Bullpen ERA L14
    r3 = subprocess.run(
        ["curl","-sf",f"https://statsapi.mlb.com/api/v1/teams/{tid}/stats?stats=byDateRange&group=pitching&startDate={start_bp}&endDate={end}&season={season}"],
        capture_output=True, text=True, timeout=10)
    if r3.returncode == 0 and r3.stdout.strip():
        try:
            sp = json.loads(r3.stdout).get("stats",[{}])[0].get("splits",[])
            if sp:
                era = sp[0]["stat"].get("era")
                if era: stats["bullpenERA_L14"] = float(era)
        except: pass

    out_data[tid] = stats
    print(f"  ✓ {name}: R/G {stats.get('rPerG','?')} L5 {stats.get('rPerG_L5','?')} BP {stats.get('bullpenERA_L14','?')}")
    time.sleep(0.2)

out = f"{ws}/team_stats_raw.json"
json.dump(out_data, open(out,"w"))
print(f"Saved: {out} ({len(out_data)} teams)")
PYEOF

      # ── Step 6: Assemble + grade + build ─────────────────────────────

      - name: Verify raw files exist
        run: |
          echo "Files in workspace:"
          ls -lh $GITHUB_WORKSPACE/*.json 2>/dev/null || echo "No JSON files found"

      - name: Assemble games_data.js
        run: |
          cd $GITHUB_WORKSPACE
          python3 odds_fetcher.py
          echo "--- games_data.js preview ---"
          head -50 games_data.js

      - name: Grade props and leans
        run: |
          cd $GITHUB_WORKSPACE
          python3 slate_builder.py
          echo "--- slate_data.js preview ---"
          head -30 slate_data.js

      - name: Build dashboard
        run: |
          cd $GITHUB_WORKSPACE
          python3 build.py

      # ── Step 7: Commit ────────────────────────────────────────────────

      - name: Commit and push
        run: |
          git config user.email "mlb-bot@dashboard"
          git config user.name "MLB Dashboard Bot"
          git add games_data.js slate_data.js mlb_dashboard.html \
                  starters_raw.json pitcher_stats_raw.json \
                  team_stats_raw.json
          git diff --staged --quiet || \
            git commit -m "Auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
