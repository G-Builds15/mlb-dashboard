name: Update MLB Dashboard

on:
  schedule:
    - cron: '0 14 * * *'   # 10:00 AM ET
    - cron: '0 21 * * *'   # 5:00 PM ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Step 1 — Fetch all data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 fetch_data.py --outdir $GITHUB_WORKSPACE

      - name: Step 2 — Assemble games_data.js
        run: python3 odds_fetcher.py --outdir $GITHUB_WORKSPACE

      - name: Step 3 — Grade props and leans
        run: python3 slate_builder.py --outdir $GITHUB_WORKSPACE

      - name: Step 4 — Build dashboard
        run: python3 build.py --outdir $GITHUB_WORKSPACE

      - name: Commit and push
        run: |
          git config user.email "mlb-bot@dashboard"
          git config user.name "MLB Dashboard Bot"
          git add games_data.js slate_data.js mlb_dashboard.html
          git diff --staged --quiet || \
            git commit -m "Auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          
