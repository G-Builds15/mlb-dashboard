name: Update MLB Odds + Starters

on:
  schedule:
    - cron: '0 14 * * *'    # 10:00 AM ET daily (14:00 UTC)
    - cron: '0 21 * * *'    # 5:00 PM ET daily (21:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run odds fetcher
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 odds_fetcher.py

      - name: Commit updated odds file
        run: |
          git config user.email "mlb-bot@dashboard"
          git config user.name "MLB Odds Bot"
          git add games_data.js
          git diff --staged --quiet || git commit -m "Update odds + starters $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          
