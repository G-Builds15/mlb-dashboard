const MLB_AVG_ERA          = 4.20;
const BULLPEN_DAY_MULT     = 1.10;  // multiplier for unknown/scratched starters
const PA_FULL              = 40;    // full Savant confidence
const PA_SOLID             = 25;    // solid confidence
const PA_LIMITED           = 15;    // pivot threshold
const STRIP_MIN_CONFIDENCE = 5;     // minimum score for strip inclusion

function mlToImplied(ml) {
  if (ml > 0) return 100 / (ml + 100);
  return Math.abs(ml) / (Math.abs(ml) + 100);
}

function fmtOddsSign(n) {
  if (!n && n !== 0) return 'TBD';
  return n > 0 ? `+${n}` : `${n}`;
}

function projectRuns(l5Rpg, pitcherEra, pitcherAvgIp, bullpenEra,
                     parkFactor, pitcherBb9 = 3.0) {
  const starterRuns = (pitcherEra / 9) * pitcherAvgIp;
  const bullpenInns = Math.max(0, 9 - pitcherAvgIp);
  const bullpenRuns = (bullpenEra / 9) * bullpenInns;
  const raw         = starterRuns + bullpenRuns;
  let   parkAdj     = raw * parkFactor;

  // BB/9 walk multiplier — high walk rates cluster baserunners
  const walkMult = pitcherBb9 >= 4.5 ? 1.10
                 : pitcherBb9 >= 4.0 ? 1.06
                 : pitcherBb9 >= 3.5 ? 1.03
                 : pitcherBb9 <= 1.8 ? 0.96
                 : pitcherBb9 <= 2.2 ? 0.98
                 : 1.00;
  parkAdj *= walkMult;

  const blended = (parkAdj * 0.60) + (l5Rpg * parkFactor * 0.40);
  return Math.round(blended * 100) / 100;
}

function winProbFromRunDiff(runDiff) {
  // Logistic function calibrated to MLB run differential
  return 1 / (1 + Math.exp(-0.37 * runDiff));
}

function scoreToGrade(score, max) {
  const pct = score / max;
  if (pct >= 0.85) return 'A-';
  if (pct >= 0.65) return 'B+';
  if (pct >= 0.45) return 'B';
  if (pct >= 0.28) return 'B-';
  return 'C+';
}

function computeGameLean(g, liveGame) {
  const park = PARK_FACTORS[g.venue] || 1.00;
  const aw   = g.overview.away;
  const hw   = g.overview.home;
  const aws  = aw.starter;
  const hws  = hw.starter;

  // ── Run projections ──────────────────────────────────────
  const awayBb9 = parseFloat(aws.bb9) || 3.0;
  const homeBb9 = parseFloat(hws.bb9) || 3.0;

  const awayRuns = projectRuns(
    parseFloat(aw.offStats.rPerG_L5) || 4.2,
    homeEraEff, homeIPEff,
    parseFloat(hw.defStats.bullpenERA_L14) || 4.20,
    park, homeBb9
  );
  const homeRuns = projectRuns(
    parseFloat(hw.offStats.rPerG_L5) || 4.2,
    awayEraEff, awayIPEff,
    parseFloat(aw.defStats.bullpenERA_L14) || 4.20,
    park, awayBb9
  );
  const projTotal = Math.round((awayRuns + homeRuns) * 100) / 100;

  // ── Pitching edge ────────────────────────────────────────
  // ── Starter assessment ────────────────────────────────
  // Bullpen pivot ONLY for genuine bullpen days (TBA, <3 starts).
  // Low xwOBA PA only gates the xwOBA adjustment — never the ERA.
  // Confirmed starters always use season ERA regardless of PA sample.
  const awayPA = parseFloat(aws.xwOBA_pa || 0);
  const homePA = parseFloat(hws.xwOBA_pa || 0);

  // Bullpen day: no confirmed starter name or clearly a reliever
  const awayBullpenDay = !aws.name || aws.name === 'TBA' || aws.name === '';
  const homeBullpenDay = !hws.name || hws.name === 'TBA' || hws.name === '';

  // ERA: always use season ERA for confirmed starters
  const awayEraEff = awayBullpenDay
    ? (parseFloat(aw.defStats.bullpenERA_L14)||4.20) * BULLPEN_DAY_MULT
    : (parseFloat(aws.era)||4.20);
  const homeEraEff = homeBullpenDay
    ? (parseFloat(hw.defStats.bullpenERA_L14)||4.20) * BULLPEN_DAY_MULT
    : (parseFloat(hws.era)||4.20);
  const awayIPEff = awayBullpenDay ? 5.0 : (parseFloat(aws.avgIP)||5.5);
  const homeIPEff = homeBullpenDay ? 5.0 : (parseFloat(hws.avgIP)||5.5);

  // Data source label — bullpen_pivot only for genuine bullpen days
  const dataSource = (awayBullpenDay || homeBullpenDay) ? 'bullpen_pivot'
    : (Math.min(awayPA, homePA) >= PA_SOLID ? 'savant' : 'era');

  const xwOBAaway = aws.xwOBA_vs_opp ? parseFloat(aws.xwOBA_vs_opp) : null;
  const xwOBAhome = hws.xwOBA_vs_opp ? parseFloat(hws.xwOBA_vs_opp) : null;

  let pitchScore = 0, pitchLean = null, pitchNote = '';
  if (xwOBAaway !== null && xwOBAhome !== null) {
    const diff = xwOBAhome - xwOBAaway; // positive = away pitcher better
    if      (diff >  0.120) { pitchScore = 3; pitchLean = 'away'; }
    else if (diff >  0.070) { pitchScore = 2; pitchLean = 'away'; }
    else if (diff >  0.030) { pitchScore = 1; pitchLean = 'away'; }
    else if (diff < -0.120) { pitchScore = 3; pitchLean = 'home'; }
    else if (diff < -0.070) { pitchScore = 2; pitchLean = 'home'; }
    else if (diff < -0.030) { pitchScore = 1; pitchLean = 'home'; }
    pitchNote = `${aws.name} xwOBA .${String(Math.round(xwOBAaway*1000)).padStart(3,'0')} vs ${hws.name} xwOBA .${String(Math.round(xwOBAhome*1000)).padStart(3,'0')}`;
  } else {
    const eraDiff = (parseFloat(aws.era)||4.20) - (parseFloat(hws.era)||4.20);
    if      (eraDiff >  1.20) { pitchScore = 3; pitchLean = 'home'; }
    else if (eraDiff >  0.70) { pitchScore = 2; pitchLean = 'home'; }
    else if (eraDiff >  0.35) { pitchScore = 1; pitchLean = 'home'; }
    else if (eraDiff < -1.20) { pitchScore = 3; pitchLean = 'away'; }
    else if (eraDiff < -0.70) { pitchScore = 2; pitchLean = 'away'; }
    else if (eraDiff < -0.35) { pitchScore = 1; pitchLean = 'away'; }
    pitchNote = `${aws.name} ERA ${aws.era} vs ${hws.name} ERA ${hws.era} (no Savant data)`;
  }

  // ── Offense edge ─────────────────────────────────────────
  const awL5 = parseFloat(aw.offStats.rPerG_L5);
  const hwL5 = parseFloat(hw.offStats.rPerG_L5);
  const offDiff = hwL5 - awL5;
  let offScore = 0, offLean = null;
  if      (Math.abs(offDiff) > 1.5) { offScore = 2; offLean = offDiff > 0 ? 'home' : 'away'; }
  else if (Math.abs(offDiff) > 0.6) { offScore = 1; offLean = offDiff > 0 ? 'home' : 'away'; }

  // ── Bullpen edge ─────────────────────────────────────────
  const awBP = parseFloat(aw.defStats.bullpenERA_L14) || 4.20;
  const hwBP = parseFloat(hw.defStats.bullpenERA_L14) || 4.20;
  const bpDiff = awBP - hwBP; // positive = home bullpen better
  let bpScore = 0, bpLean = null;
  if (Math.abs(bpDiff) > 0.80) { bpScore = 1; bpLean = bpDiff > 0 ? 'home' : 'away'; }

  // ── Park lean ────────────────────────────────────────────
  let parkScore = 0, parkLean = null;
  if (park < 0.95) { parkScore = 1; parkLean = 'home'; }

  // ── Injury cap ───────────────────────────────────────────
  const awayStarterInjured = (aw.injuries||[]).some(i =>
    i.player && aws.name && i.player.includes(aws.name.split(' ').pop()));
  const homeStarterInjured = (hw.injuries||[]).some(i =>
    i.player && hws.name && i.player.includes(hws.name.split(' ').pop()));
  const injuryCap = awayStarterInjured || homeStarterInjured;

  // ── Run line grade ───────────────────────────────────────
  const votes = { away: 0, home: 0 };
  [[pitchLean, pitchScore],[offLean, offScore],[bpLean, bpScore],[parkLean, parkScore]]
    .forEach(([lean, score]) => { if (lean) votes[lean] += score; });

  const rlSide   = votes.away > votes.home ? 'away' : 'home';
  const rlTeam   = rlSide === 'away' ? g.away : g.home;
  const rlScore  = votes[rlSide];
  let rlGrade    = scoreToGrade(rlScore, 7);

  // Pick-em cap
  const xwDiff = (xwOBAaway !== null && xwOBAhome !== null)
    ? Math.abs(xwOBAhome - xwOBAaway) : 0;
  if (xwDiff < 0.040 && pitchScore <= 1 && offScore <= 1) {
    if (['A-','B+'].includes(rlGrade)) rlGrade = 'B';
  }
  if (injuryCap && ['A-'].includes(rlGrade)) rlGrade = 'B+';

  // Fix 2 — Savant sample size cap (awayPA/homePA from bullpen pivot above)
  const lowSample = (awayPA > 0 && awayPA < 25) || (homePA > 0 && homePA < 25);
  if (lowSample && ['A-','B+','B'].includes(rlGrade)) rlGrade = 'B-';

  // Fix 3 — Projected run differential threshold cap
  const projDiff = Math.abs(runDiff);
  const RSTEPS   = ['A-','B+','B','B-','C+','C'];
  let diffCap;
  if      (projDiff >= 1.50) diffCap = 'B+';
  else if (projDiff >= 1.00) diffCap = 'B';
  else if (projDiff >= 0.60) diffCap = 'B-';
  else                        diffCap = 'C+';
  if (RSTEPS.indexOf(diffCap) > RSTEPS.indexOf(rlGrade)) rlGrade = diffCap;

  // ── Moneyline — market-anchored model ────────────────
  // Start from market implied probability.
  // Adjust only with verified data: xwOBA diff, real L5 R/G, injuries.
  let mlResult = null;
  if (liveGame && liveGame.lines && liveGame.lines.raw) {
    const r       = liveGame.lines.raw;
    const aML     = r.awayML;
    const hML     = r.homeML;

    if (aML !== null && hML !== null) {
      const impAw = mlToImplied(aML);
      const impHw = mlToImplied(hML);

      let adjAw = impAw;
      let adjHw = impHw;
      const adjustments = [];
      let hasRealData   = false;

      // Adjustment 1 — xwOBA differential (Savant, 25+ PA each)
      const awPA  = parseFloat(aws.xwOBA_pa || 0);
      const hwPA  = parseFloat(hws.xwOBA_pa || 0);
      const xwA   = xwOBAaway;
      const xwH   = xwOBAhome;

      if (xwA !== null && xwH !== null && awPA >= 25 && hwPA >= 25) {
        const xwDiff = xwH - xwA;  // positive = away pitcher better
        const xwAdj  = Math.min(0.06, Math.max(-0.06, xwDiff * 0.60));
        adjAw += xwAdj;
        adjHw -= xwAdj;
        hasRealData = true;
        if (Math.abs(xwDiff) > 0.030)
          adjustments.push(`xwOBA ${xwDiff > 0 ? '+' : ''}${(xwDiff).toFixed(3)} → ${xwAdj > 0 ? '+' : ''}${(xwAdj*100).toFixed(1)}%`);
      }

      // Adjustment 2 — real L5 R/G from ODDS_DATA team stats
      const awayL5real = liveGame.team_stats?.away?.rPerG_L5;
      const homeL5real = liveGame.team_stats?.home?.rPerG_L5;
      if (awayL5real && homeL5real) {
        const rpgDiff = parseFloat(awayL5real) - parseFloat(homeL5real);
        const rpgAdj  = Math.min(0.04, Math.max(-0.04, rpgDiff * 0.02));
        adjAw += rpgAdj;
        adjHw -= rpgAdj;
        hasRealData = true;
        if (Math.abs(rpgDiff) > 0.5)
          adjustments.push(`L5 R/G ${rpgDiff > 0 ? '+' : ''}${rpgDiff.toFixed(1)} → ${rpgAdj > 0 ? '+' : ''}${(rpgAdj*100).toFixed(1)}%`);
      }

      // Normalize
      const tot = adjAw + adjHw;
      adjAw /= tot;
      adjHw /= tot;

      const gapAw  = adjAw - impAw;
      const gapHw  = adjHw - impHw;
      const mlSide = gapAw >= gapHw ? 'away' : 'home';
      const mlWP   = mlSide === 'away' ? adjAw : adjHw;
      const mlGap  = mlSide === 'away' ? gapAw : gapHw;
      const mlML   = mlSide === 'away' ? aML   : hML;
      const mlTeam = mlSide === 'away' ? g.away : g.home;

      // Grade — requires real data, tighter thresholds
      let mlGrade;
      if (hasRealData) {
        if      (mlGap > 0.07) mlGrade = 'B+';
        else if (mlGap > 0.04) mlGrade = 'B';
        else if (mlGap > 0.02) mlGrade = 'B-';
        else                    mlGrade = 'C';
      } else {
        mlGrade = 'C';  // no real data — parlay only
      }

      // Parlay: use projection-based win prob (matchup dominance)
      const projWP  = mlSide === 'away' ? awayWinP : homeWinP;
      const parlayF = projWP > 0.58 && ['C','C+'].includes(mlGrade);

      mlResult = {
        team: mlTeam, side: mlSide, grade: mlGrade,
        winProb: mlWP, impliedProb: mlSide==='away' ? impAw : impHw,
        valueGap: mlGap, odds: mlML,
        parlayFlag: parlayF, hasRealData,
        awayWinP: adjAw, homeWinP: adjHw,
        adjustments,
      };
    }
  }

  // Fallback win probs for parlay detection when no live odds
  const awayWinProb = awayWinP;
  const homeWinProb = homeWinP;

  return {
    awayRuns, homeRuns, projTotal,
    runLine: { team: rlTeam, side: rlSide, grade: rlGrade, score: rlScore, bullets: rlBullets.slice(0,3) },
    moneyLine: mlResult ? { ...mlResult, bullets: mlBullets.slice(0,3) }
                        : { team: awayWinP > 0.5 ? g.away : g.home, grade: 'TBD',
                            parlayFlag: false, bullets: mlBullets.slice(0,3) },
    total: { ...totResult, bullets: totBullets.slice(0,3) },
  };
}

  const lean = computeGameLean(g, liveGame);
  const rl   = lean.runLine;

function buildDropdown() {
  var sel = document.getElementById('gsel');
  sel.innerHTML = '';
  var meta = document.getElementById('hdr-meta');
  if (meta) {
    var d = new Date().toLocaleDateString('en-US',
      {weekday:'short',month:'short',day:'numeric',year:'numeric'});
    meta.textContent = d + ' · ' + Object.keys(games).length + ' Games';
  }
  if (typeof games === 'undefined' || !Object.keys(games).length) {
    sel.innerHTML = '<option>No games loaded</option>';
    return;
  }
  var afternoon=[], evening=[], late=[];
  Object.keys(games).forEach(function(k) {
    var t = (games[k].time||'');
    var m = t.match(/(\d+):\d+\s*(AM|PM)/i);
    if (!m) { evening.push(k); return; }
    var h = parseInt(m[1]);
    var pm = m[2].toUpperCase() === 'PM';
    if (pm && h!==12) h+=12; else if (!pm && h===12) h=0;
    if (h<17) afternoon.push(k); else if (h<21) evening.push(k); else late.push(k);
  });
  function addGrp(label, arr) {
    if (!arr.length) return;
    var grp = document.createElement('optgroup');
    grp.label = label;
    arr.forEach(function(k) {
      var o = document.createElement('option');
      o.value = k;
      o.textContent = games[k].away + ' @ ' + games[k].home + ' — ' + games[k].time;
      grp.appendChild(o);
    });
    sel.appendChild(grp);
  }
  addGrp('── Afternoon ──', afternoon);
  addGrp('── Evening ──',   evening);
  addGrp('── Late ──',      late);
  var first = Object.keys(games)[0];
  sel.value = first;
  loadGame(first);
}

document.getElementById('gsel').addEventListener('change', function(e) {
  loadGame(e.target.value);
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('active'); });
  var ov = document.querySelector('.tab[data-tab="overview"]');
  if (ov) ov.classList.add('active');
});

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => { buildDropdown(); renderStrip(); });
} else {
  buildDropdown();
  renderStrip();
}

const TEAM_NAME_MAP = {
  'NYY': 'New York Yankees',   'BAL': 'Baltimore Orioles',

  'TOR': 'Toronto Blue Jays',  'SF':  'San Francisco Giants',

  'MIN': 'Minnesota Twins',    'DET': 'Detroit Tigers',
  'KC':  'Kansas City Royals', 'CLE': 'Cleveland Guardians',
  'CIN': 'Cincinnati Reds',    'PIT': 'Pittsburgh Pirates',
  'SD':  'San Diego Padres',   'AZ':  'Arizona Diamondbacks',
  'OAK': 'Athletics',
};

// ─────────────────────────────────────────────
// PROP MARKET LABELS
// ─────────────────────────────────────────────
const PROP_MARKET_LABELS = {
  pitcher_strikeouts:    'Strikeouts',
  pitcher_earned_runs:   'Earned Runs',
  pitcher_walks:         'Walks',
  pitcher_outs:          'Outs Recorded',
  pitcher_hits_allowed:  'Hits Allowed',
};

// ─────────────────────────────────────────────
// CORE: find a game in ODDS_DATA
// ─────────────────────────────────────────────
function findLiveGame(awayAbbr, homeAbbr) {
  if (typeof ODDS_DATA === 'undefined') return null;
  const awayFull = TEAM_NAME_MAP[awayAbbr] || awayAbbr;
  const homeFull = TEAM_NAME_MAP[homeAbbr] || homeAbbr;
  return ODDS_DATA.games.find(g =>
    (g.home.includes(homeFull) || g.home === homeAbbr) &&
    (g.away.includes(awayFull) || g.away === awayAbbr)
  ) || null;
}

// ─────────────────────────────────────────────
// CORE: find prop line for a player
// ─────────────────────────────────────────────
function findPropLine(liveGame, playerLastName, market) {
  if (!liveGame || !liveGame.props) return null;
  const last = playerLastName.toLowerCase();
  const playerKey = Object.keys(liveGame.props).find(k =>
    k.toLowerCase().includes(last)
  );
  if (!playerKey) return null;
  return liveGame.props[playerKey][market] || null;
}

// ─────────────────────────────────────────────
// FORMAT HELPERS
// ─────────────────────────────────────────────
function fmtOdds(n) {
  if (n == null) return 'N/A';
  return n > 0 ? `+${n}` : `${n}`;
}

function fmtLine(point, overOdds, underOdds) {
  if (point == null) return 'N/A';
  return `O/U ${point} (Over ${fmtOdds(overOdds)} / Under ${fmtOdds(underOdds)})`;
}

// ─────────────────────────────────────────────
// INJECT: overview tab lines
// Patches the lines section of the overview tab with live data
// ─────────────────────────────────────────────
function injectOverviewLines(liveGame) {
  if (!liveGame) return;
  const r = liveGame.lines.raw;
  const boxes = document.querySelectorAll('.ov-line-box');
  if (!boxes.length) return;

  const vals = [
    // [0] Moneyline
    `${liveGame.away.split(' ').pop()} ${fmtOdds(r.awayML)} / ${liveGame.home.split(' ').pop()} ${fmtOdds(r.homeML)}`,
    // [1] Run Line — away -1.5 / home +1.5
    `${liveGame.away.split(' ').pop()} ${r.awaySpread > 0 ? '+' : ''}${r.awaySpread} (${fmtOdds(r.awaySpreadOdds)})`,
    // [2] Total
    `O/U ${r.total} (Over ${fmtOdds(r.overOdds)} / Under ${fmtOdds(r.underOdds)})`,
    // [3] Movement — live source note
    `Live · FanDuel/DraftKings`,
  ];

  boxes.forEach((box, i) => {
    if (i < vals.length) {
      const valEl = box.querySelector('.ov-line-val');
      if (valEl) {
        valEl.textContent = vals[i];
        valEl.style.color = 'var(--gold)';
      }
    }
  });

  // Add live badge
  const linesSection = document.querySelector('.ov-section.full');
  if (linesSection && !linesSection.querySelector('.live-badge')) {
    const badge = document.createElement('div');
    badge.className = 'live-badge';
    badge.innerHTML = `⚡ Live — The Odds API · Updated ${new Date(ODDS_DATA.fetched_at).toLocaleTimeString('en-US', {hour:'numeric',minute:'2-digit'})}`;
    linesSection.querySelector('.ov-section-title').after(badge);
  }
}

// ─────────────────────────────────────────────
// INJECT: prop card odds
// Patches odds chips and odds display on pitcher prop cards
// ─────────────────────────────────────────────
function injectPropOdds(liveGame) {
  if (!liveGame) return;

  // Find all odds chips on cards in the active panel
  const cards = document.querySelectorAll('.panel.active .card');
  cards.forEach(card => {
    // Try to extract pitcher name and market from card label
    const lblEl = card.querySelector('.card-lbl');
    const pickEl = card.querySelector('.card-pick');
    if (!lblEl || !pickEl) return;

    const lbl = lblEl.textContent;  // e.g. "Gray — Strikeouts"
    const pick = pickEl.textContent; // e.g. "Over 5.5 Ks"

    // Identify market
    let market = null;
    if (lbl.includes('Strikeout') || pick.includes('Ks'))    market = 'pitcher_strikeouts';
    else if (lbl.includes('Earned Run') || pick.includes('ER')) market = 'pitcher_earned_runs';
    else if (lbl.includes('Walks') || pick.includes('BB'))    market = 'pitcher_walks';
    else if (lbl.includes('Outs'))                             market = 'pitcher_outs';
    else if (lbl.includes('Hits'))                             market = 'pitcher_hits_allowed';
    if (!market) return;

    // Extract pitcher last name from label "Gray — Strikeouts" → "Gray"
    const lastName = lbl.split('—')[0].trim().split(' ').pop();
    const propData = findPropLine(liveGame, lastName, market);
    if (!propData) return;

    // Determine direction from pick text
    const isOver = pick.toLowerCase().includes('over');
    const liveOdds = isOver ? propData.over : propData.under;
    const livePoint = propData.point;

    if (liveOdds == null) return;

    // Update odds chip
    const oddsEl = card.querySelector('.odds-chip');
    if (oddsEl) {
      const oldOdds = oddsEl.textContent;
      const newOdds = fmtOdds(liveOdds);
      if (oldOdds !== newOdds) {
        oddsEl.textContent = newOdds;
        oddsEl.style.background = 'rgba(200,168,75,0.25)';
        oddsEl.title = `Updated from ${oldOdds}`;
      }
    }

    // If line point differs from displayed, add a note
    const displayedPick = pick.trim();
    const displayedPoint = parseFloat(displayedPick.replace(/[^0-9.]/g, ''));
    if (livePoint != null && Math.abs(livePoint - displayedPoint) >= 0.5) {
      // Line has moved
      if (!card.querySelector('.live-line-note')) {
        const note = document.createElement('div');
        note.className = 'live-line-note';
        note.textContent = `⚡ Live line: ${isOver ? 'Over' : 'Under'} ${livePoint} ${fmtOdds(liveOdds)} · was ${displayedPick}`;
        card.querySelector('.card-rat')?.after(note);
      }
    }
  });
}

// ─────────────────────────────────────────────
// INJECT: game total on total tab
// ─────────────────────────────────────────────
function injectTotalLine(liveGame) {
  if (!liveGame) return;
  const r = liveGame.lines.raw;
  const totalCards = document.querySelectorAll('.panel[data-panel="total"] .card');
  totalCards.forEach(card => {
    const oddsEl = card.querySelector('.odds-chip');
    const pickEl = card.querySelector('.card-pick');
    if (!oddsEl || !pickEl) return;
    const isOver = pickEl.textContent.toLowerCase().includes('over');
    const liveOdds = fmtOdds(isOver ? r.overOdds : r.underOdds);
    if (oddsEl.textContent !== liveOdds) {
      oddsEl.textContent = liveOdds;
      oddsEl.style.background = 'rgba(200,168,75,0.25)';
    }
  });
}

// ─────────────────────────────────────────────
// MAIN ENTRY POINT
// Call this after loadGame() renders panels
// ─────────────────────────────────────────────
function injectLiveOdds(awayAbbr, homeAbbr) {
  if (typeof ODDS_DATA === 'undefined') {
    console.log('ODDS_DATA not loaded — run odds_fetcher.py and include games_data.js');
    return;
  }
  const liveGame = findLiveGame(awayAbbr, homeAbbr);
  if (!liveGame) {
    console.log(`No live data for ${awayAbbr} @ ${homeAbbr}`);
    return;
  }
  console.log(`Injecting live odds for ${awayAbbr} @ ${homeAbbr}`);
  injectOverviewLines(liveGame);
  injectPropOdds(liveGame);
  injectTotalLine(liveGame);
  // Re-render lean block with live odds
  const leanContainer = document.querySelector('.panel.active [class="ov-section"]');
  if (leanContainer) {
    const key = document.getElementById('gsel').value;
    const g   = games[key];
    if (g) leanContainer.innerHTML = renderLeanBlock(g, liveGame);
  }
}
